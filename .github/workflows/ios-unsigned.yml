name: iOS 未签名 ipa

# 只手动跑:仓库 Actions 页 → 选本工作流 → 右上角 Run workflow
# (故意不加 push 触发:每次 push 都自动编译太耗额度,要打包时手动点一次即可)
#
# 为什么在 GitHub 上编:iOS 只能在 macOS 上编译,
# 这里借用 GitHub 免费提供的 macOS 机器,你本地(Windows)不用装任何苹果工具链。
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    # 发布 Release 需要写权限(GITHUB_TOKEN 默认只读)
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 安装 Flutter(与本机一致 3.47.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: 装依赖
        run: flutter pub get

      - name: 环境诊断(编译失败时先看这一步的输出)
        run: |
          echo "===== Xcode ====="; xcodebuild -version
          echo "===== CocoaPods ====="; pod --version
          echo "===== flutter doctor ====="; flutter doctor -v

      - name: 编译 iOS(不签名)
        # 不签名也能编:产物是 Runner.app,后面用 Sideloadly / AltStore 自签安装
        run: flutter build ios --release --no-codesign

      - name: 打成未签名 ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry YunYunMusic-unsigned.ipa Payload
          ls -lh YunYunMusic-unsigned.ipa

      - name: 上传产物(Artifacts,30 天)
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: flutter_app/build/ios/iphoneos/YunYunMusic-unsigned.ipa
          retention-days: 30

      - name: 发布到 Releases(固定下载直链)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: "iOS 未签名 ipa(最新)"
          body: |
            未签名 ipa,用 Sideloadly / AltStore 借自己的 Apple ID 自签后安装(免费账号 7 天有效)。

            固定直链(永久有效,每次运行覆盖更新):
            https://github.com/lcssdwl/yin/releases/download/ios-latest/YunYunMusic-unsigned.ipa
          files: flutter_app/build/ios/iphoneos/YunYunMusic-unsigned.ipa
          # 找不到文件直接报错,别静默产出空发布
          fail_on_unmatched_files: true
          # 重复运行时覆盖同名资产(否则第二次会报 already exists)
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
