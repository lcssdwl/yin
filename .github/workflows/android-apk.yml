name: 安卓 APK

# 只手动跑:仓库 Actions 页 → 选本工作流 → 右上角 Run workflow
# (故意不加 push 触发:每次 push 都自动编译太耗额度,要打包时手动点一次即可)
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    # 发布 Release 需要写权限(GITHUB_TOKEN 默认只读)
    permissions:
      contents: write

    # 可选:让 CI 打出的 APK 与你本机签名一致。
    # 不配也行 —— 但 CI 的 debug 签名和本机不同,覆盖安装会提示「应用未安装」,
    # 需要先卸载旧版。配法见 编译5.txt(把本机 debug.keystore 转 base64 存进 secret)。
    env:
      KS_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 安装 Flutter(与本机一致 3.47.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: 读取版本号(pubspec.yaml)
        # 注意:这里必须用多行写法(|)。写成单行 run: 时,命令里的
        # sed 's/version: *//' 含「冒号+空格」,在 YAML 里是非法标量
        run: |
          FULL=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | tr -d '\r')
          VER=${FULL%%+*}   # pubspec 是 1.0.84+84,+84 是安卓 versionCode,文件名只用 1.0.84
          echo "APP_FULL=$FULL" >> "$GITHUB_ENV"
          echo "APP_VER=$VER" >> "$GITHUB_ENV"
          echo "版本号:$VER (完整 $FULL)"

      - name: 确定接口地址并写入 url.txt
        # 仓库 Settings → Secrets and variables → Actions → Variables
        # 新建 API_BASE_URL 可覆盖(换服务器时改那里,不用改代码)
        # 地址写入 assets/url.txt(打包进 APK),不再用 dart-define
        run: |
          URL="${{ vars.API_BASE_URL }}"
          if [ -z "$URL" ]; then
            URL="https://nvh7g6dz-8000.asse.devtunnels.ms"
          fi
          printf '%s' "$URL" > assets/url.txt
          echo "版本 $APP_VER / 接口地址 $URL (已写入 assets/url.txt)"

      - name: 写入本机调试签名(仅当配置了 secret)
        if: ${{ env.KS_B64 != '' }}
        run: |
          mkdir -p ~/.android
          echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
          echo "已使用仓库 secret 里的 debug.keystore(与本机签名一致)"

      - name: 装依赖
        run: flutter pub get

      - name: 编译 APK(arm64,手机用)
        run: flutter build apk --release --target-platform android-arm64

      - name: 保存 arm64 包
        run: cp build/app/outputs/flutter-apk/app-release.apk "YunYunMusic-v${APP_VER}-arm64.apk"

      - name: 编译通用 APK(arm64 + armeabi-v7a + x86_64,云手机/模拟器用)
        # 云手机、安卓模拟器常是 x86_64 或 32 位,只装 arm64 包会「解析包错误 / 闪退」
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "YunYunMusic-v${APP_VER}-universal.apk"
          ls -lh YunYunMusic-*.apk

      - name: 上传产物(Artifacts,30 天)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: flutter_app/YunYunMusic-*.apk
          retention-days: 30

      - name: 复制一份固定文件名的包(给 Releases 直链用)
        run: |
          cp "YunYunMusic-v${APP_VER}-arm64.apk" YunYunMusic-arm64.apk
          cp "YunYunMusic-v${APP_VER}-universal.apk" YunYunMusic-universal.apk

      - name: 发布到 Releases(固定下载直链)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "安卓 APK(最新)"
          body: |
            版本 ${{ env.APP_FULL }}

            固定直链(永久有效,每次运行覆盖更新):
            https://github.com/lcssdwl/yin/releases/download/android-latest/YunYunMusic-arm64.apk

            装之前注意:CI 的调试签名与本机不同,覆盖安装若提示「应用未安装」,先卸载旧版;
            或在仓库 secret 里配置 DEBUG_KEYSTORE_BASE64 让两边签名一致。

            两个包的区别:
            - YunYunMusic-arm64.apk     真机手机用(体积小)
            - YunYunMusic-universal.apk 云手机 / 模拟器用(含 x86_64 与 32 位)
          # 注意:action(不是 run 步骤)不受工作流的 working-directory 影响,
          # 路径必须从**仓库根目录**写起,否则找不到文件、会生成一个没有附件的空发布
          files: |
            flutter_app/YunYunMusic-arm64.apk
            flutter_app/YunYunMusic-universal.apk
          # 找不到文件直接报错,别静默产出空发布
          fail_on_unmatched_files: true
          # 重复运行时覆盖同名资产(否则第二次会报 already exists)
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
